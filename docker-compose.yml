services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MEDIA_ROOT: /media
      PURCHASE_INVOICE_ROOT: /purchase_invoices
    volumes:
      # Product images, kept outside the git-managed code directory so they
      # survive `git reset --hard` deploys and rebuilds.
      - /srv/handpikd-media:/media
      # Uploaded vendor purchase-invoice PDFs (see
      # backend/app/services/purchase_invoice_storage.py) — also outside the
      # code directory, but a separate volume from /media since these are
      # never served publicly (pricing/GSTIN info).
      - /srv/handpikd-purchase-invoices:/purchase_invoices
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_MEDIA_BASE_URL: ""
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend

  # Not a long-running service — issues/renews the TLS cert for
  # handpikd.co and www.handpikd.co via the webroot nginx shares above.
  # Run on demand with
  # `docker compose run --rm certbot certonly ...` (see deploy guide). The
  # image's own default (certbot --help) is already a harmless no-op if this
  # ever gets started via `docker compose up`, so no entrypoint override is
  # needed here — and one would actually break `docker compose run`, since
  # any override replaces the whole command, not just the default no-args
  # case.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-etc:
  certbot-webroot:
