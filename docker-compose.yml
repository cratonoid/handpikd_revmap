# The backend and frontend images are built by GitHub Actions and pushed to
# ghcr.io (.github/workflows/deploy.yml); the VPS only pulls them, so a
# deploy no longer spends 10+ minutes of the server's CPU on `npm run build`
# while it is serving the site. IMAGE_TAG is the commit being deployed; the
# `build:` sections remain for building the same images by hand.
services:
  backend:
    image: ghcr.io/cratonoid/handpikd_revmap-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      labels:
        # Links the ghcr.io package to this repo, so the workflow's own
        # GITHUB_TOKEN can push and pull it.
        org.opencontainers.image.source: https://github.com/cratonoid/handpikd_revmap
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Pinned here rather than left to the server's .env: `environment:`
      # overrides `env_file:`, so a dev-style AUTH_ENABLED=False copied into
      # the server's .env can't silently switch off require_admin (see
      # backend/app/api/deps.py) and leave every /admin endpoint public.
      # Local dev runs uvicorn directly, not through compose, so its bypass
      # is unaffected.
      AUTH_ENABLED: "true"
      MEDIA_ROOT: /media
      PURCHASE_INVOICE_ROOT: /purchase_invoices
      BACKUP_ROOT: /backups
    volumes:
      # Product images, kept outside the git-managed code directory so they
      # survive `git reset --hard` deploys and rebuilds.
      - /srv/handpikd-media:/media
      # Uploaded vendor purchase-invoice PDFs (see
      # backend/app/services/purchase_invoice_storage.py) — also outside the
      # code directory, but a separate volume from /media since these are
      # never served publicly (pricing/GSTIN info).
      - /srv/handpikd-purchase-invoices:/purchase_invoices
      # Whole-site backups (see backend/app/services/backup.py), made,
      # uploaded and restored from /admin/backups. A volume of its own so a
      # backup never sits inside the media folders it copies.
      - /srv/handpikd-backups:/backups
    expose:
      - "8000"

  frontend:
    image: ghcr.io/cratonoid/handpikd_revmap-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      labels:
        org.opencontainers.image.source: https://github.com/cratonoid/handpikd_revmap
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_MEDIA_BASE_URL: ""
        # GA4 "handpikd" web stream (https://handpikd.co). Public by
        # design — it appears in every page's HTML — so it's fine in git.
        NEXT_PUBLIC_GA_ID: G-DW9TNLFM1C
    restart: unless-stopped
    volumes:
      # Next's optimized-image cache (/_next/image). Without a volume it lives
      # in the container and every deploy throws it away, so the first visits
      # after each deploy waited seconds per image while the server
      # re-encoded them all. Only images/: the rest of .next/cache belongs to
      # one build.
      - /srv/handpikd-next-image-cache:/app/.next/cache/images
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend

  # Not a long-running service — issues/renews the TLS cert for
  # handpikd.co and www.handpikd.co via the webroot nginx shares above.
  # Run on demand with
  # `docker compose run --rm certbot certonly ...` (see deploy guide). The
  # image's own default (certbot --help) is already a harmless no-op if this
  # ever gets started via `docker compose up`, so no entrypoint override is
  # needed here — and one would actually break `docker compose run`, since
  # any override replaces the whole command, not just the default no-args
  # case.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-etc:
  certbot-webroot:
