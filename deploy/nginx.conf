# Reverse proxy: FastAPI backend under /api/, everything else to Next.js.
# Same-origin routing means the frontend's NEXT_PUBLIC_API_BASE_URL can stay
# a relative "/api/v1" (see frontend/Dockerfile) with no CORS setup needed.

# Plain HTTP: only alive for the ACME challenge (cert issuance/renewal via
# the certbot service in docker-compose.yml) and to send everything else to
# HTTPS.
server {
    listen 80;
    server_name handpikd.co www.handpikd.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name handpikd.co www.handpikd.co;

    ssl_certificate /etc/letsencrypt/live/handpikd.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handpikd.co/privkey.pem;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admin catalogue PDFs are the one genuinely large upload the API
        # takes (real ones run past 300MB), so the limit is raised here rather
        # than on the whole server -- nothing served under / needs it, and the
        # 20M default above stays in force for everything else. Uploads over
        # this are rejected by nginx with a 413 before the backend sees them,
        # which uploadCataloguePdf in frontend/src/lib/catalogues.ts reports as
        # a size error rather than a generic failure.
        client_max_body_size 400M;

        # Sending a few hundred megabytes over a slow uplink outlasts the
        # default 60s timeouts. Only the PDF upload needs this much room: its
        # pages are rendered one short request at a time afterward (see
        # backend/app/api/routes/catalogues.py).
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Product images (see backend/app/services/storage.py) — same backend,
    # served through FastAPI's StaticFiles mount rather than nginx reading
    # the volume directly, so dev and prod behave identically.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR and any websocket-based features need the upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
