# Reverse proxy: FastAPI backend under /api/, everything else to Next.js.
# Same-origin routing means the frontend's NEXT_PUBLIC_API_BASE_URL can stay
# a relative "/api/v1" (see frontend/Dockerfile) with no CORS setup needed.
#
# TLS: HTTP-only for now. Once DNS for mvp.handpikd.co resolves here and a
# cert has been issued via the certbot service (docker-compose.yml), a
# `listen 443 ssl` server block gets added alongside this one — see the
# deploy guide for that follow-up step. Left in place either way so Let's
# Encrypt's HTTP-01 challenge (and renewals) keep working.

server {
    listen 80;
    server_name mvp.handpikd.co;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product images (see backend/app/services/storage.py) — same backend,
    # served through FastAPI's StaticFiles mount rather than nginx reading
    # the volume directly, so dev and prod behave identically.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR and any websocket-based features need the upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
