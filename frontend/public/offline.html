<!doctype html>
<!-- Served by public/sw.js when an admin page can't be loaded for lack of
     network. Fully self-contained (inline styles, no fonts or images) because
     nothing else is cached — any external request would fail too. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1ed" />
    <title>Offline | Handpikd Admin</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
        background: #f5f1ed; color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 320px; }
      h1 { font-size: 1.375rem; margin: 0 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #4a4a4a; }
      button {
        font: inherit; font-weight: 600;
        padding: 12px 24px; min-height: 44px;
        border: 0; border-radius: 999px;
        background: #1a1a1a; color: #f5f1ed; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Handpikd Admin needs a connection to show live orders, stock and invoices. Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
